# Conteúdo comum aos modos HTTP e HTTPS: frontend estático e repasse de /api/ para a API.
root /usr/share/nginx/html;
server_tokens off;
# O padrão do nginx (1 MB) barraria a planilha do PDA; a API aceita até 5 MB
client_max_body_size 6m;

# Login: no máximo 20 tentativas por minuto por IP, rajada de 10 (ISO 27002 8.5). Atrás de proxy,
# o IP é o do usuário só se GDA_PROXY_CONFIAVEL estiver certo; senão todos dividem este limite.
location = /api/v1/acesso/login {
  limit_req zone=gda_login burst=10 nodelay;
  limit_req_status 429;
  include /etc/nginx/gda/proxy-api.conf;
}

location /api/ {
  include /etc/nginx/gda/proxy-api.conf;
}

# Cache (ADR-0029): a API responde no-store (backend); index.html sempre revalidado, para o
# navegador pegar os JS/CSS novos (com hash no nome) depois de um deploy
location = /index.html {
  include /etc/nginx/gda/seguranca-front.conf;
  add_header Cache-Control "no-cache" always;
}

location / {
  include /etc/nginx/gda/seguranca-front.conf;
  try_files $uri /index.html;
}
