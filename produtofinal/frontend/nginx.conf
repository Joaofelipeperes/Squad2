server {
  listen 80;
  root /usr/share/nginx/html;
  # client_max_body_size: o padrão do nginx (1 MB) barraria a planilha do PDA; a API aceita até 5 MB
  # X-Forwarded-For sobrescrito (não acumulado): o IP real do usuário chega ao log de acesso
  location /api/ { proxy_pass http://api:8000; proxy_set_header Host $host; proxy_read_timeout 180s;
                   proxy_set_header X-Forwarded-For $remote_addr;
                   client_max_body_size 6m; }
  location / { try_files $uri /index.html; }
}
