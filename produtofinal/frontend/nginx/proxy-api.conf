# Repasse para a API. X-Forwarded-For SOBRESCRITO (não acumulado) com o IP real já resolvido pelo
# real-ip.conf: é o único valor em que a API confia, e só vindo deste container (ADR-0016).
proxy_pass http://api:8000;
proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Real-IP $remote_addr;
# Varredura LGPD, coleta do CKAN e relatórios podem demorar
proxy_read_timeout 180s;
proxy_send_timeout 180s;
include /etc/nginx/gda/seguranca-base.conf;
