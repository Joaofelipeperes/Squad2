# Telas: além dos cabeçalhos base, CSP. Tudo é servido daqui (sem CDN); 'unsafe-inline' só em
# estilos, porque o React usa style={...}. Não vale para /api/ (a documentação /api/v1/docs da API
# carrega o Swagger de um CDN).
include /etc/nginx/gda/seguranca-base.conf;
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
