server {
  listen 80;
  root /usr/share/nginx/html;
  # IP real atrás do proxy reverso (ADR-0016, revisão de 05/11/2026): só se confia no X-Forwarded-For
  # vindo do proxy (GDA_PROXY_CONFIAVEL, substituído pelo envsubst do nginx ao iniciar). Quem acessar
  # direto fica com o próprio IP, e um X-Forwarded-For forjado pelo cliente é ignorado.
  set_real_ip_from ${GDA_PROXY_CONFIAVEL};
  real_ip_header X-Forwarded-For;
  real_ip_recursive on;
  # client_max_body_size: o padrão do nginx (1 MB) barraria a planilha do PDA; a API aceita até 5 MB
  # X-Forwarded-For sobrescrito (não acumulado): o IP real do usuário chega ao log de acesso
  location /api/ { proxy_pass http://api:8000; proxy_set_header Host $host; proxy_read_timeout 180s;
                   proxy_set_header X-Forwarded-For $remote_addr;
                   client_max_body_size 6m; }
  # Cache (ADR-0029): a API responde com Cache-Control no-store (backend);
  # index.html sempre revalidado: depois de um deploy o navegador pega os novos JS/CSS (com hash no nome)
  location = /index.html { add_header Cache-Control "no-cache"; }
  location / { try_files $uri /index.html; }
}
