# Proxy reverso da UFG → GDA (Monitor Dados Abertos GO)
# Domínio: https://gestao-dadosabertos.rsi.inf.ufg.br  ·  Servidor temporário para testes da CGE-GO
#
# O que este proxy faz: termina o HTTPS e repassa tudo para o container "web" da aplicação
# (porta 8080 do servidor da aplicação). O container serve as telas e encaminha /api/ para a API.
#
# Três pontos importantes (log de acesso com o IP real do usuário — LGPD e Marco Civil):
#   1. X-Forwarded-For SOBRESCRITO com $remote_addr (não usar $proxy_add_x_forwarded_for).
#   2. Ajustar o "proxy_pass" para o endereço do servidor da aplicação.
#   3. Informar ao Victor o IP com que ESTE proxy chega ao servidor da aplicação: só desse IP o
#      X-Forwarded-For é aceito pela aplicação.
#
# Requer nginx 1.25.1+ (diretiva "http2 on"). Em versão anterior, troque por "listen 443 ssl http2;".

server {
    listen 80;
    listen [::]:80;
    server_name gestao-dadosabertos.rsi.inf.ufg.br;
    server_tokens off;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name gestao-dadosabertos.rsi.inf.ufg.br;
    server_tokens off;

    # Certificado do domínio (ajustar aos caminhos do servidor de proxy)
    ssl_certificate     /etc/ssl/certs/gestao-dadosabertos.rsi.inf.ufg.br.crt;
    ssl_certificate_key /etc/ssl/private/gestao-dadosabertos.rsi.inf.ufg.br.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:gda_tls:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Força HTTPS no navegador por 1 ano (só este domínio; sem includeSubDomains para não afetar
    # outros sites de inf.ufg.br). Os demais cabeçalhos de segurança vêm da aplicação.
    add_header Strict-Transport-Security "max-age=31536000" always;

    # Upload da planilha do PDA: a aplicação aceita até 5 MB (padrão do nginx é 1 MB)
    client_max_body_size 6m;

    location / {
        # >>> AJUSTAR: endereço do servidor da aplicação (IP interno, se houver) e porta 8080
        proxy_pass http://IP_DO_SERVIDOR_DA_APLICACAO:8080;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        # Varredura LGPD, coleta do CKAN e relatórios podem demorar
        proxy_connect_timeout 10s;
        proxy_read_timeout    180s;
        proxy_send_timeout    180s;
    }
}
