# Proxy reverso → GDA (Monitor Dados Abertos GO) — https://gestao-dadosabertos.inf.ufg.br
# Destino: container "web" do docker-compose, publicado na porta 8080 do servidor da aplicação.
# Ele serve o frontend e repassa /api/ para a API; aqui basta encaminhar tudo.
#
# IMPORTANTE para o log de acesso (IP real do usuário, ADR-0016):
#   - manter o X-Forwarded-For SOBRESCRITO com $remote_addr (não acumular);
#   - informar ao Victor o IP com que este proxy chega ao servidor da aplicação
#     (vai em GDA_PROXY_CONFIAVEL no .env de lá).

server {
    listen 80;
    server_name gestao-dadosabertos.inf.ufg.br;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name gestao-dadosabertos.inf.ufg.br;

    # Certificado do domínio (ajustar aos caminhos do servidor de proxy)
    ssl_certificate     /etc/ssl/certs/gestao-dadosabertos.inf.ufg.br.crt;
    ssl_certificate_key /etc/ssl/private/gestao-dadosabertos.inf.ufg.br.key;

    # Upload da planilha do PDA: a API aceita até 5 MB (padrão do nginx é 1 MB)
    client_max_body_size 6m;

    location / {
        # Ajustar para o IP interno do servidor da aplicação (127.0.0.1 se for a mesma máquina)
        proxy_pass http://IP_DO_SERVIDOR_DA_APLICACAO:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Varredura LGPD, coleta do CKAN e relatórios podem demorar
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }
}
