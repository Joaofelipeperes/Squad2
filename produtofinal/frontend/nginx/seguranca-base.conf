# Cabeçalhos de segurança de todas as respostas (ISO 27002 8.26). Incluído em cada location,
# porque um add_header na location anula os do server.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
# Vazio no modo HTTP (o proxy com TLS envia o HSTS); preenchido no modo HTTPS próprio
add_header Strict-Transport-Security $gda_hsts always;
