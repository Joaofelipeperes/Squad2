# Modo HTTPS próprio (ADR-0032): usado quando a CGE coloca o certificado em deploy/certificados/
# (fullchain.pem e privkey.pem). A porta 80 só redireciona.
limit_req_zone $binary_remote_addr zone=gda_login:10m rate=20r/m;

server {
  listen 80;
  server_name _;
  server_tokens off;
  include /etc/nginx/gda/real-ip.conf;
  include /etc/nginx/gda/redirect.conf;
}

server {
  listen 443 ssl;
  http2 on;
  server_name _;

  ssl_certificate     /etc/nginx/certs/fullchain.pem;
  ssl_certificate_key /etc/nginx/certs/privkey.pem;
  ssl_protocols       TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers off;
  ssl_session_cache   shared:gda_tls:10m;
  ssl_session_timeout 1d;
  ssl_session_tickets off;

  set $gda_hsts "max-age=31536000";
  include /etc/nginx/gda/real-ip.conf;
  include /etc/nginx/gda/app.conf;
}
