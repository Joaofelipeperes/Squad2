# Modo HTTP (padrão, ADR-0032): o HTTPS fica com o proxy reverso na frente (UFG, CGE).
# Escolhido por 30-gda-config.sh quando não há certificado em /etc/nginx/certs.
limit_req_zone $binary_remote_addr zone=gda_login:10m rate=20r/m;

server {
  listen 80;
  server_name _;
  set $gda_hsts "";   # HSTS é do proxy que faz o TLS
  include /etc/nginx/gda/real-ip.conf;
  include /etc/nginx/gda/app.conf;
}
